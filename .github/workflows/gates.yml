name: gates

on:
  pull_request:
  push:
    branches: [main]
    tags: [pa2]

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pa2
          POSTGRES_PASSWORD: pa2
          POSTGRES_DB: pa2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pa2 -d pa2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pa2:pa2@localhost:5432/pa2_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/check-go-format.mjs
      - run: go -C backend vet ./...
      - run: go -C backend test ./... -count=1
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend

  security:
    name: secret-history
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit
        working-directory: frontend

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
